istst_core.home:
  path: '/home'
  defaults:
    _controller: '\Drupal\istst_core\Controller\HomeController::content'
    _title: 'Home'
  requirements:
    _permission: 'access content'

istst_core.member_registration:
  path: '/member-registration'
  defaults:
    _controller: '\Drupal\istst_core\Controller\MemberRegistrationController::content'
    _title: 'Member Registration'
  requirements:
    _permission: 'access content'
